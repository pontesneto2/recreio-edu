version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dependencias:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Os tipos acompanham a versão do Node em .nvmrc (24).
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # babel-plugin-react-compiler 1.0 pula componentes com Babel 8.
      - dependency-name: '@babel/core'
        update-types: [version-update:semver-major]
      # TypeScript 7 entra quando typescript-eslint suportar.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directories: [/apps/api, /apps/web]
    schedule:
      interval: weekly
    ignore:
      # A imagem do Node acompanha a versão de .nvmrc (24).
      - dependency-name: node
        update-types: [version-update:semver-major]
