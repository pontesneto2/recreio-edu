# Cabeçalhos de segurança do portal. Cada location que usa add_header inclui este arquivo,
# porque um add_header dentro da location descarta os herdados do server.
#
# CSP: scripts só da própria origem. style-src aceita 'unsafe-inline' porque os componentes
# usam a prop style. As fontes vêm do Google Fonts (@import em recreio.css).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
