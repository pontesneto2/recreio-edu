<!-- @dsCard height=288 -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Sistema Recreio</title>
<style>
body{margin:0;background:var(--surface-0);}
.cv{position:relative;width:960px;height:288px;overflow:hidden;background:var(--surface-0);}
.cv svg{position:absolute;inset:0;display:block;}
.cv .ink{fill:var(--ink);}
.cv .brand{fill:var(--brand);}
.cv .accent{fill:var(--accent);}
.cv .verde{fill:var(--cat-verde);}
.cv .row{fill:var(--brand);}
.cv .row-on{fill:var(--accent);}
.cv .r-xl{rx:var(--radius-xl);ry:var(--radius-xl);}
.cv-text{position:absolute;left:48px;bottom:36px;width:420px;}
.cv-name{margin:0;font-family:var(--font-display);font-weight:800;font-size:96px;line-height:.95;letter-spacing:-.035em;color:var(--ink);}
.cv-tag{margin:10px 0 0;font-family:var(--font-sans);font-size:14px;line-height:20px;color:var(--ink-2);}
</style>
</head>
<body>
<div id="root" class="cv">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
blocks: ink 200x328 (a navegação marinho), brand 128x156, accent pílula 140x56, cat-verde 268x156; lados em múltiplos de space-2 (8px)
arrangement: uma laje alta sangrando em cima e embaixo, dois blocos empilhados ao lado e a pílula amarela saindo pela direita, como a tela do sistema com a navegação à esquerda
pattern: uma pilha de linhas em pílula dentro da laje, com a linha ativa em accent; escolhido porque o README define a navegação marinho com marcador amarelo e as listas em linhas como a assinatura do sistema
scales: pílulas de 20 (space-5) com passo de 32 (space-8) e cantos de metade da altura; blocos com radius-xl; pílula amarela com metade do lado curto
-->
<rect class="ink r-xl" x="496" y="-20" width="200" height="328"/>
<rect class="row" x="520" y="44" width="152" height="20" rx="10"/>
<rect class="row-on" x="520" y="76" width="152" height="20" rx="10"/>
<rect class="row" x="520" y="108" width="120" height="20" rx="10"/>
<rect class="row" x="520" y="140" width="136" height="20" rx="10"/>
<rect class="row" x="520" y="172" width="104" height="20" rx="10"/>
<rect class="row" x="520" y="204" width="144" height="20" rx="10"/>
<rect class="brand r-xl" x="712" y="-20" width="128" height="156"/>
<rect class="accent" x="856" y="48" width="140" height="56" rx="28"/>
<rect class="verde r-xl" x="712" y="152" width="268" height="156"/>
</svg>
<div class="cv-text">
<h1 class="cv-name">Sistema Recreio</h1>
<p class="cv-tag">Toda a escola. Em um só lugar.</p>
</div>
</div>
</body>
</html>
