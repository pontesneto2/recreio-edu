<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Celular: Chat</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/recreio/tokens.css">
<link rel="stylesheet" href="ds/recreio/components/bundle.css">
<script src="ds/recreio/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:var(--surface-0)}
a{color:var(--brand-ink)}a:hover{color:var(--brand-strong)}
</style>
</helmet>
<x-import component-from-global-scope="Recreio.RecreioProvider">
<div class="rc-app">
<div class="rc-app-status" aria-hidden="true"><span>9:41</span><span class="rc-app-status-icons"><i></i><b></b></span></div>
<div class="rc-app-scroll">
<div style="flex: 1; min-height: 0; display: flex; flex-direction: column; height: 736px;">
<x-import component-from-global-scope="Recreio.MessageThread" subject="Coordenação · Fundamental II" participants="Juliana Sampaio · sobre a Ana Beatriz" sla="Resposta em até 1 dia útil" typing="Juliana" messages="{{msgs}}"></x-import>
</div>
</div>
<x-import component-from-global-scope="Recreio.TabBar" items="{{tabs}}" active="chat"></x-import>
</div>
</x-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const shared = {
      tabs: [{ id: 'hoje', label: 'Hoje', icon: 'home', href: 'Celular-Hoje.dc.html' }, { id: 'agenda', label: 'Agenda', icon: 'calendar', count: 2, href: 'Celular-Agenda.dc.html' }, { id: 'financeiro', label: 'Financeiro', icon: 'wallet', count: 1, href: 'Celular-Financeiro.dc.html' }, { id: 'chat', label: 'Chat', icon: 'chat', count: 1, href: 'Celular-Chat.dc.html' }, { id: 'mais', label: 'Mais', icon: 'menu', href: 'Celular-Mais.dc.html' }]
    };
    return Object.assign({ yes: true, no: false }, shared, {
      msgs: [
        { id: 1, from: 'me', text: 'Bom dia, Juliana. A Ana Beatriz ficou com 5,4 em Matemática no 3º bimestre. Como funciona a recuperação?', time: '9h58', status: 'lida' },
        { id: 2, from: 'escola', author: 'Juliana Sampaio', text: 'Bom dia, Fernanda. Ela já está no reforço de quarta, às 14h, com o Prof. Ricardo. A prova de recuperação é em 10/12.', time: '10h40' },
        { id: 3, from: 'escola', author: 'Juliana Sampaio', text: 'Deixo o roteiro de estudo. No 4º bimestre a nota parcial dela já subiu para 8,8.', file: 'roteiro-recuperacao-matematica.pdf', time: '10h42' },
        { id: 4, from: 'me', text: 'Que bom! Muito obrigada, vou acompanhar por aqui.', time: '10h45', status: 'enviada' }]
    });
  }
}
</script>
</body>
</html>
