<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Gestão: Grupos e permissões</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/recreio/tokens.css">
<link rel="stylesheet" href="ds/recreio/components/bundle.css">
<script src="ds/recreio/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:var(--surface-0)}
a{color:var(--brand-ink)}a:hover{color:var(--brand-strong)}
</style>
</helmet>
<x-import component-from-global-scope="Recreio.RecreioProvider">
<div class="rc-shell" style="font-family: var(--font-sans); color: var(--ink);">
<div class="rc-shell-side">
<x-import component-from-global-scope="Recreio.SideNav" school="{{school}}" units="{{units}}" groups="{{nav}}" active="permissoes"></x-import>
</div>
<div class="rc-shell-main">
<header style="position: sticky; top: 0; z-index: 10; background: var(--surface-1); border-bottom: 1px solid var(--line);">
<div class="rc-shell-bar" style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px;">
<div class="rc-pagehead" style="flex: 1 1 260px;"><span class="rc-pagehead-icon" aria-hidden="true"><x-import component-from-global-scope="Recreio.Icon" name="shield" size="{{s22}}"></x-import></span><div class="rc-pagehead-text"><h1 style="margin: 0; font-size: 1.375rem; font-weight: 750; letter-spacing: -0.025em;">Grupos e permissões</h1><p style="margin: 0; font-size: 14px; color: var(--ink-2);">Quem pode ver, criar, editar, excluir e aprovar em cada módulo</p></div></div>
<x-import component-from-global-scope="Recreio.SearchField" placeholder="Buscar funcionário" style="flex: 1 1 280px; max-width: 380px;"></x-import>
<details class="rc-bellmenu">
<summary class="rc-iconbtn rc-iconbtn-primary" aria-label="Notificações"><x-import component-from-global-scope="Recreio.Icon" name="bell" size="{{s20}}"></x-import><span class="rc-iconbtn-badge">{{bellCount}}</span></summary>
<div class="rc-bellmenu-panel" role="dialog" aria-label="Notificações">
<div class="rc-bellmenu-head"><strong>Notificações</strong><a class="rc-btn rc-btn-ghost rc-btn-sm" href="#pop-lidas">Marcar todas como lidas</a></div>
<ul class="rc-bellmenu-list">
<sc-for list="{{bellNotifs}}" as="n" hint-placeholder-count="4">
<x-import component-from-global-scope="Recreio.NotificationItem" index="{{ $index }}" icon="{{n.icon}}" title="{{n.title}}" text="{{n.text}}" time="{{n.time}}" unread="{{n.unread}}" priority="{{n.priority}}"></x-import>
</sc-for>
</ul>
<a class="rc-bellmenu-all" href="Escola-Notificacoes.dc.html">Ver todas as notificações</a>
</div>
</details>
<x-import component-from-global-scope="Recreio.ProfileSwitcher" user="{{user}}" dependents="{{kids}}" active-child="{{activeChild}}" profiles="{{profiles}}" active-profile="{{activeProfile}}"></x-import>
</div>
</header>
<main class="rc-shell-content" style="display: flex; flex-direction: column; gap: 24px; box-sizing: border-box;">
<section aria-label="Indicadores de acesso" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 16px;">
<x-import component-from-global-scope="Recreio.StatCard" color="azul" label="Grupos" value="{{nGrupos}}" icon="shield" hint="7 padrão · 5 criados pela escola"></x-import>
<x-import component-from-global-scope="Recreio.StatCard" color="verde" label="Pessoas com acesso" value="{{nPessoas}}" icon="users" hint="Unidade Aldeota · 4 em mais de um grupo"></x-import>
<x-import component-from-global-scope="Recreio.StatCard" color="amarelo" label="Sem verificação em 2 etapas" value="{{sem2fa}}" icon="lock" hint="Portaria e monitores do integral"></x-import>
<x-import component-from-global-scope="Recreio.StatCard" color="roxo" label="Mudanças em 30 dias" value="{{mudancas}}" icon="history" hint="Todas no registro de auditoria" href="#auditoria"></x-import>
</section>
<x-import component-from-global-scope="Recreio.PermissionMatrix" default-group="prof" default-open="notas" groups="{{groups}}" modules="{{mods}}" value="{{val}}" scopes="{{scopes}}" rules="{{rules}}" restrictions="{{restr}}"></x-import>
<div id="auditoria"><x-import component-from-global-scope="Recreio.Card" title="Registro de auditoria" subtitle="Quem mudou cada permissão e quando. A direção recebe um resumo semanal.">
<div>
<sc-for list="{{audit}}" as="a" hint-placeholder-count="5">
<div class="rc-popup-row" style="grid-template-columns: 36px minmax(0, 1fr) auto;"><x-import component-from-global-scope="Recreio.Avatar" name="{{a.quem}}" size="{{s36}}"></x-import><span style="min-width: 0;"><strong style="display: block;">{{a.oque}}</strong><small style="color: var(--ink-2);">{{a.quem}} · {{a.quando}}</small></span><x-import component-from-global-scope="Recreio.StatusPill" tone="{{a.tone}}" size="sm">{{a.tipo}}</x-import></div>
</sc-for>
</div>
</x-import></div>
</main>
</div>
<div class="rc-shell-tabbar">
<x-import component-from-global-scope="Recreio.TabBar" items="{{tabs}}" active="permissoes"></x-import>
</div>
</div>
<div id="pop-lidas" class="rc-overlay rc-popup" role="dialog" aria-modal="true" aria-label="Notificações marcadas como lidas">
<a class="rc-popup-close" href="#" aria-label="Fechar" tabindex="-1"></a>
<div class="rc-dialog rc-dialog-sm rc-dialog-hero">
<div class="rc-dialog-head"><span class="rc-dialog-icon rc-tone-success"><x-import component-from-global-scope="Recreio.Icon" name="check-circle" size="{{pS32}}"></x-import></span><div class="rc-dialog-titles"><p class="rc-dialog-title">Notificações marcadas como lidas</p><p class="rc-dialog-desc">O sino volta a avisar quando chegar algo novo.</p></div></div>
<div class="rc-dialog-foot"><a class="rc-btn rc-btn-primary" href="#">Concluir</a></div>
</div>
</div>
</x-import>
</x-dc>
