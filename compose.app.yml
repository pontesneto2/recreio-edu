# API e portal com as imagens de produção, ligados aos serviços de docker-compose.yml.
#   docker compose -f compose.app.yml up --build
# O portal fica em http://localhost:8080 e repassa /api para a API na rede interna.
name: recreio

include:
  - docker-compose.yml

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: recreio-api:local
    environment:
      NODE_ENV: production
      PORT: 3333
      CORS_ORIGIN: http://localhost:${WEB_PORT:-8080}
      LOG_LEVEL: info
      DATABASE_URL: postgres://recreio_app:recreio_app@postgres:5432/recreio
      DATABASE_MIGRATION_URL: postgres://recreio:recreio@postgres:5432/recreio
      DEV_ESCOLA_DOMINIO: colegiorecreio.localhost
      REDIS_URL: redis://redis:6379
      SMTP_URL: smtp://mailpit:1025
      S3_ENDPOINT: http://storage:9000
      S3_ACCESS_KEY: recreio
      S3_SECRET_KEY: recreio-storage
      S3_BUCKET: recreio
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: recreio-web:local
    environment:
      API_UPSTREAM: http://api:3333
    ports:
      - '${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
